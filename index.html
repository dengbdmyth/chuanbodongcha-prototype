<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>传播洞察平台 - 监测项目列表</title>
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/home.css">
</head>
<body>
  <div class="app-shell" data-page="home">
    <aside class="common-sidebar">
      <a class="common-brand" href="./index.html" aria-label="传播洞察平台首页">
        <span class="common-brand-mark" aria-hidden="true">
          <span class="common-brand-eye"></span>
        </span>
        <span class="common-brand-copy">
          <strong>传播洞察平台</strong>
          <span>BRAND INSIGHT PLATFORM</span>
        </span>
      </a>

      <nav class="common-nav" aria-label="主导航">
        <section class="common-nav-section">
          <h2>监测模块</h2>
          <a class="common-nav-item is-active" href="./index.html">
            <span class="common-nav-icon common-icon-target" aria-hidden="true"></span>
            <span>监测项目列表</span>
          </a>
          <a class="common-nav-item" href="./pages/module-alert.html">
            <span class="common-nav-icon common-icon-alert" aria-hidden="true"></span>
            <span>传播告警</span>
          </a>
        </section>

        <section class="common-nav-section">
          <h2>智能报告</h2>
          <button class="common-nav-item" type="button" data-coming="报告管理模块将在后续独立页面中开发">
            <span class="common-nav-icon common-icon-report" aria-hidden="true"></span>
            <span>报告管理</span>
          </button>
          <button class="common-nav-item" type="button" data-coming="报告模板中心将在后续独立页面中开发">
            <span class="common-nav-icon common-icon-template" aria-hidden="true"></span>
            <span>报告模板中心</span>
          </button>
        </section>

        <section class="common-nav-section">
          <h2>处置业务</h2>
          <a class="common-nav-item" href="./pages/module-evidence.html">
            <span class="common-nav-icon common-icon-evidence" aria-hidden="true"></span>
            <span>识别取证</span>
          </a>
          <a class="common-nav-item" href="./pages/module-disposal.html">
            <span class="common-nav-icon common-icon-disposal" aria-hidden="true"></span>
            <span>信息处置</span>
          </a>
          <a class="common-nav-item" href="./pages/module-tail-maintenance.html">
            <span class="common-nav-icon common-icon-tail" aria-hidden="true"></span>
            <span>尾翼维护</span>
          </a>
        </section>

        <section class="common-nav-section">
          <h2>系统管理</h2>
          <button class="common-nav-item" type="button" data-coming="账号管理模块将在后续独立页面中开发">
            <span class="common-nav-icon common-icon-user" aria-hidden="true"></span>
            <span>账号管理</span>
          </button>
          <button class="common-nav-item" type="button" data-coming="刷新记录日志将在后续独立页面中开发">
            <span class="common-nav-icon common-icon-refresh" aria-hidden="true"></span>
            <span>刷新记录日志</span>
          </button>
          <button class="common-nav-item" type="button" data-coming="互动量刷新管理将在后续独立页面中开发">
            <span class="common-nav-icon common-icon-sync" aria-hidden="true"></span>
            <span>互动量刷新管理</span>
          </button>
          <button class="common-nav-item" type="button" data-coming="分类设置模块将在后续独立页面中开发">
            <span class="common-nav-icon common-icon-classify" aria-hidden="true"></span>
            <span>分类设置</span>
          </button>
        </section>
      </nav>

      <div class="common-balance-card">
        <span>洞察豆余额</span>
        <strong>32,580</strong>
        <div class="common-balance-track" aria-hidden="true">
          <span style="width: 66%"></span>
        </div>
      </div>
    </aside>

    <main class="app-main">
      <header class="common-topbar">
        <div class="common-breadcrumb">
          <button class="common-icon-button" type="button" data-action="toggle-sidebar" aria-label="收起侧边栏">
            <span class="common-icon-menu" aria-hidden="true"></span>
          </button>
          <span>监测模块</span>
          <span class="common-breadcrumb-divider">›</span>
          <strong>监测项目列表</strong>
        </div>

        <div class="common-top-actions">
          <button class="common-icon-button" type="button" data-coming="消息中心将在后续完善" aria-label="消息中心">
            <span class="common-dot"></span>
            <span class="common-icon-bell" aria-hidden="true"></span>
          </button>
          <button class="common-icon-button" type="button" data-coming="帮助中心将在后续完善" aria-label="帮助中心">
            <span class="common-icon-help" aria-hidden="true"></span>
          </button>
          <button class="common-avatar-button" type="button" data-coming="个人中心将在后续完善" aria-label="个人中心">
            <span>U</span>
          </button>
        </div>
      </header>

      <section class="home-page" aria-label="监测项目列表">
        <section class="home-kpi-grid" aria-label="数据概览">
          <article class="home-kpi-card">
            <div>
              <span>监测项目总数</span>
              <strong data-count-up="245678">245,678</strong>
            </div>
            <span class="home-kpi-visual home-kpi-bars" aria-hidden="true"></span>
          </article>
          <article class="home-kpi-card">
            <div>
              <span>运行中项目</span>
              <strong data-count-up="245678">245,678</strong>
            </div>
            <span class="home-kpi-visual home-kpi-scan" aria-hidden="true"></span>
          </article>
          <article class="home-kpi-card">
            <div>
              <span>今日新增数量</span>
              <strong data-count-up="245678">245,678</strong>
            </div>
            <span class="home-kpi-visual home-kpi-stack" aria-hidden="true"></span>
          </article>
          <article class="home-kpi-card">
            <div>
              <span>今日洞察豆消耗</span>
              <strong data-count-up="678">678</strong>
            </div>
            <span class="home-kpi-visual home-kpi-nodes" aria-hidden="true"></span>
          </article>
        </section>

        <section class="home-filter-panel" aria-label="项目筛选">
          <div class="home-filter-row">
            <label class="home-field">
              <span>项目搜索</span>
              <input id="homeSearch" type="search" placeholder="请输入">
            </label>
            <label class="home-field">
              <span>监测类型</span>
              <select id="homeMonitorType">
                <option value="all">全部</option>
                <option value="keyword">关键词监测</option>
                <option value="account">媒体账号监测</option>
                <option value="mixed">混合监测</option>
              </select>
            </label>
            <div class="home-filter-actions">
              <button class="common-text-button" type="button" id="homeExpandFilters">展开</button>
              <button class="common-button common-button-light" type="button" id="homeResetFilters">重置</button>
              <button class="common-button common-button-primary" type="button" id="homeApplyFilters">确定</button>
            </div>
          </div>

          <div class="home-filter-row">
            <label class="home-field">
              <span>情感状态</span>
              <select id="homeSentiment">
                <option value="all">全部</option>
                <option value="positive">正向占优</option>
                <option value="negative">负向预警</option>
                <option value="neutral">中性占优</option>
              </select>
            </label>
            <label class="home-field">
              <span>创建日期</span>
              <input id="homeCreatedDate" type="date">
            </label>
          </div>

          <div class="home-filter-row home-advanced-row" id="homeAdvancedFilters" hidden>
            <label class="home-field">
              <span>监测平台</span>
              <select id="homePlatform">
                <option value="all">全部平台</option>
                <option value="微博">微博</option>
                <option value="抖音">抖音</option>
                <option value="快手">快手</option>
                <option value="懂车帝">懂车帝</option>
              </select>
            </label>
            <label class="home-field">
              <span>项目状态</span>
              <select id="homeProjectStatus">
                <option value="all">全部状态</option>
                <option value="running">运行中</option>
                <option value="draft">草稿箱</option>
                <option value="archived">归档</option>
              </select>
            </label>
          </div>
        </section>

        <section class="home-list-head" aria-label="项目列表工具栏">
          <div class="home-tabs" role="tablist" aria-label="项目状态">
            <button class="home-tab is-active" type="button" data-tab="all" role="tab" aria-selected="true">全部项目 <span>9</span></button>
            <button class="home-tab" type="button" data-tab="running" role="tab" aria-selected="false">运行中</button>
            <button class="home-tab" type="button" data-tab="draft" role="tab" aria-selected="false">草稿箱</button>
            <button class="home-tab" type="button" data-tab="archived" role="tab" aria-selected="false">归档</button>
          </div>

          <div class="home-list-tools">
            <label class="home-sort">
              <span class="sr-only">排序</span>
              <select id="homeSort">
                <option value="created-desc">监测创建时间</option>
                <option value="comments-desc">评论量最高</option>
                <option value="data-desc">数据量最高</option>
              </select>
            </label>
            <div class="home-view-switch" aria-label="列表展示方式">
              <button class="is-active" type="button" data-view="grid" aria-label="网格视图">
                <span class="home-icon-grid" aria-hidden="true"></span>
              </button>
              <button type="button" data-view="list" aria-label="列表视图">
                <span class="home-icon-list" aria-hidden="true"></span>
              </button>
            </div>
            <button class="common-button common-button-primary home-create-button" type="button" id="homeCreateProject">新建监测项目</button>
          </div>
        </section>

        <section class="home-project-grid" id="homeProjectGrid" aria-live="polite"></section>
      </section>
    </main>
  </div>

  <div class="common-toast" id="commonToast" role="status" aria-live="polite"></div>

  <div class="common-modal" id="homeProjectModal" aria-hidden="true">
    <div class="common-modal-backdrop" data-modal-close></div>
    <section class="common-modal-panel" role="dialog" aria-modal="true" aria-labelledby="homeProjectModalTitle">
      <header class="common-modal-head">
        <h2 id="homeProjectModalTitle">新建监测项目</h2>
        <button class="common-icon-button" type="button" data-modal-close aria-label="关闭">
          <span class="common-icon-close" aria-hidden="true"></span>
        </button>
      </header>
      <form class="home-project-form" id="homeProjectForm">
        <label class="home-form-field">
          <span>项目名称</span>
          <input name="title" type="text" placeholder="请输入项目名称" required>
        </label>
        <label class="home-form-field">
          <span>监测类型</span>
          <select name="type">
            <option value="keyword">关键词监测</option>
            <option value="account">媒体账号监测</option>
            <option value="mixed">混合监测</option>
          </select>
        </label>
        <label class="home-form-field">
          <span>首选平台</span>
          <select name="platform">
            <option value="微博">微博</option>
            <option value="抖音">抖音</option>
            <option value="快手">快手</option>
            <option value="懂车帝">懂车帝</option>
          </select>
        </label>
        <footer class="common-modal-actions">
          <button class="common-button common-button-light" type="button" data-modal-close>取消</button>
          <button class="common-button common-button-primary" type="submit">保存项目</button>
        </footer>
      </form>
    </section>
  </div>

  <script src="./js/common.js"></script>
  <script src="./js/home.js"></script>
</body>
</html>
